<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aeternum Screening</title>
<meta name="theme-color" content="#19191B">
<meta name="description" content="Online screening GLP-1 programu Aeternum Clinic. Zjistěte, zda je pro vás terapie vhodná a jaký preparát odpovídá vašemu cíli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ground:#19191B; --ink:#F4F4F6; --muted:rgba(244,244,246,.62); --dim:rgba(244,244,246,.40);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.24);
  --grad:linear-gradient(90deg,#7A3E9E,#2F86CC);
  --grad-135:linear-gradient(135deg,#7A3E9E,#2F86CC);
  --grad-text:linear-gradient(90deg,#A27AD2,#4FA3E0);
  --good:#5ED3A0; --ok:#B5D333; --warn:#F2B45A; --crit:#EE7A6D;
  --gut:clamp(20px,calc(7.3*var(--u)),calc(140px*var(--k)));
  --u:min(1vw,1.7778vh); --k:1;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (min-width:2200px) and (min-height:1200px){:root{--k:1.35}}
@media (min-width:3000px) and (min-height:1650px){:root{--k:2}}
@media (max-width:760px){:root{--u:1vw}}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font)}
body{min-height:100dvh;line-height:1.5}
button,input,select{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid #4FA3E0;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- pozadí ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--ground)}
.bg svg.wave{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}
@media (max-width:760px){.bg .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,25,27,.92) 0%,rgba(25,25,27,.7) 55%,rgba(25,25,27,.15) 100%)}}

/* ---------- kostra ---------- */
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(18px,calc(3.1*var(--u)),calc(58px*var(--k))) var(--gut) 0}
main{flex:1;display:flex;align-items:center;padding:clamp(28px,calc(3.2*var(--u)),calc(60px*var(--k))) var(--gut)}
main > .screen{width:100%}
.foot{padding:0 var(--gut) clamp(20px,calc(3.6*var(--u)),calc(70px*var(--k)));display:flex;flex-direction:column;gap:clamp(20px,calc(2.4*var(--u)),calc(44px*var(--k)))}
.foot:empty{display:none}
.screen{animation:rise .4s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* logo */
.logo{display:flex;align-items:center;gap:clamp(12px,calc(1.15*var(--u)),calc(22px*var(--k)));text-decoration:none;color:inherit}
.logo svg{width:clamp(40px,calc(2.95*var(--u)),calc(56px*var(--k)));height:clamp(40px,calc(2.95*var(--u)),calc(56px*var(--k)));fill:none;stroke:#6B3A96;stroke-width:6.5;flex:none}
.logo .wm{display:flex;flex-direction:column;gap:4px}
.logo .wm b{font-size:clamp(18px,calc(1.38*var(--u)),calc(26px*var(--k)));font-weight:600;letter-spacing:.035em;line-height:1;background:linear-gradient(90deg,#6E3D9C,#2F7FC4);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .wm span{font-size:clamp(8px,calc(.58*var(--u)),calc(11px*var(--k)));letter-spacing:.44em;color:#6B4A9A;font-weight:500;line-height:1}
.logo.big svg{width:clamp(54px,calc(5.25*var(--u)),calc(100px*var(--k)));height:clamp(54px,calc(5.25*var(--u)),calc(100px*var(--k)))}
.logo.big .wm{gap:6px}
.logo.big .wm b{font-size:clamp(24px,calc(2.4*var(--u)),calc(46px*var(--k)))}
.logo.big .wm span{font-size:clamp(10px,calc(1.05*var(--u)),calc(20px*var(--k)))}

.contacts{display:flex;gap:clamp(18px,calc(2.3*var(--u)),calc(44px*var(--k)))}
.contacts a{display:block;width:clamp(30px,calc(2.2*var(--u)),calc(42px*var(--k)));height:clamp(30px,calc(2.2*var(--u)),calc(42px*var(--k)))}
.contacts svg{width:100%;height:100%}

.prog{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.prog .lbl{font-size:clamp(11px,calc(.8*var(--u)),calc(15px*var(--k)));letter-spacing:.32em;font-weight:600;color:var(--dim);white-space:nowrap}
.prog .lbl b{color:var(--ink);font-weight:600}
.segs{display:flex;gap:7px}
.segs i{width:clamp(16px,calc(2*var(--u)),calc(38px*var(--k)));height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.top-actions{display:flex;align-items:center;gap:14px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--dim);font-size:clamp(11px,calc(.75*var(--u)),calc(13px*var(--k)));letter-spacing:.26em;font-weight:600;cursor:pointer;text-transform:uppercase}
.linkbtn:hover{color:var(--ink)}
@media (max-width:760px){.prog .lbl{display:none}}

/* typografie */
.eyebrow{display:inline-block;font-size:clamp(11px,calc(.85*var(--u)),calc(16px*var(--k)));font-weight:600;letter-spacing:.34em;text-transform:uppercase;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:block;width:clamp(64px,calc(5.2*var(--u)),calc(100px*var(--k)));height:4px;background:var(--grad)}
.h-hero{margin:0;font-size:clamp(38px,calc(5*var(--u)),calc(96px*var(--k)));font-weight:700;line-height:1.1;letter-spacing:-.012em;text-wrap:balance}
.light{font-weight:400;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-xl{margin:clamp(10px,calc(1*var(--u)),calc(18px*var(--k))) 0 0;font-size:clamp(34px,calc(5.2*var(--u)),calc(104px*var(--k)));font-weight:700;line-height:1;letter-spacing:-.02em}
.h-l{margin:clamp(10px,calc(1*var(--u)),calc(18px*var(--k))) 0 0;font-size:clamp(30px,calc(3.75*var(--u)),calc(72px*var(--k)));font-weight:700;line-height:1.12;letter-spacing:-.012em}
.body-wide{font-size:clamp(15px,calc(1.35*var(--u)),calc(26px*var(--k)));font-weight:500;letter-spacing:.14em;line-height:1.62;color:rgba(244,244,246,.92);max-width:31em}
.lead{font-size:clamp(15px,calc(1.15*var(--u)),calc(22px*var(--k)));font-weight:500;letter-spacing:.04em;line-height:1.62;color:var(--muted);max-width:30em}
.small-caps{font-size:clamp(11px,calc(.8*var(--u)),calc(15px*var(--k)));letter-spacing:.3em;font-weight:600;color:var(--dim);text-transform:uppercase}
@media (max-width:760px){.body-wide{letter-spacing:.05em}}

/* tlačítka */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:clamp(54px,calc(3.45*var(--u)),calc(66px*var(--k)));padding:0 clamp(26px,calc(2.4*var(--u)),calc(46px*var(--k)));border-radius:999px;border:0;font-size:clamp(13px,calc(.9*var(--u)),calc(17px*var(--k)));font-weight:700;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;cursor:pointer;transition:filter .15s,transform .1s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.lime{background:#B0D43B;color:#0F1208}
.btn.soft-crit{background:rgba(238,122,109,.12);border:1.5px solid rgba(238,122,109,.45);color:#F0A49B}
.btn.soft-crit:hover{background:rgba(238,122,109,.2);border-color:rgba(238,122,109,.7);color:#F5BDB6}
.btn.lime:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.28);color:var(--ink)}
.btn.ghost:hover{border-color:rgba(255,255,255,.55)}
.btn.sm{height:clamp(44px,calc(2.7*var(--u)),calc(52px*var(--k)));padding:0 clamp(18px,calc(1.6*var(--u)),calc(30px*var(--k)));font-size:clamp(11px,calc(.73*var(--u)),calc(14px*var(--k)))}
.btn[disabled]{opacity:.38;cursor:default}
.round{width:clamp(54px,calc(3.45*var(--u)),calc(66px*var(--k)));height:clamp(54px,calc(3.45*var(--u)),calc(66px*var(--k)));border-radius:50%;border:1.5px solid rgba(255,255,255,.28);background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.round:hover{border-color:rgba(255,255,255,.55)}
.round svg{width:calc(24px*var(--k));height:calc(24px*var(--k));stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navrow{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(12px,calc(1*var(--u)),calc(20px*var(--k)))}
.nav-right{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:clamp(12px,calc(1*var(--u)),calc(20px*var(--k)));margin-left:auto}
.navrow .err{flex:1;text-align:right}
.err{font-size:clamp(13px,calc(.85*var(--u)),calc(16px*var(--k)));color:var(--crit);font-weight:600;letter-spacing:.02em}
.err:empty{display:none}
@media (max-width:760px){
  .foot.sticky{position:sticky;bottom:0;padding-top:22px;background:linear-gradient(to top,var(--ground) 72%,rgba(25,25,27,0))}
  .navrow{align-items:flex-start}
  .nav-right{flex:1 1 0;min-width:0;gap:10px}
  .nav-right .btn{flex:1 1 100%}
  .nav-right .btn.pri{order:-1}
  .navrow .err{flex-basis:100%;order:-1;text-align:left}
}

/* pruh sekcí */
.strip{display:flex;flex-wrap:wrap;gap:clamp(12px,calc(1.15*var(--u)),calc(22px*var(--k)));font-size:clamp(12px,calc(1*var(--u)),calc(19px*var(--k)));font-weight:500;letter-spacing:.34em;color:rgba(244,244,246,.34);white-space:nowrap}
.strip b{font-weight:600;color:var(--ink)}
.strip.all{color:var(--ink)}
@media (max-width:1100px){.strip.qs{display:none}}
@media (max-width:760px){.strip{font-size:11px;letter-spacing:.22em;gap:8px 10px}}

.intro{max-width:calc(1100px*var(--k))}
.fitline{display:block;white-space:nowrap;line-height:1.14;padding-bottom:.04em}
.intro-lead{font-size:clamp(13px,calc(1.12*var(--u)),calc(21px*var(--k)))}
body.fixed{overflow:hidden;height:100dvh}
/* nízké obrazovky (telefon na šířku): kompaktnější rozestupy, ať se vejde vše */
@media (max-height:560px){
  body.fixed .top{padding-top:10px}
  body.fixed main{padding-top:10px;padding-bottom:8px}
  body.fixed .foot{padding-bottom:10px;gap:10px}
  body.fixed .foot .strip{display:none}
  body.fixed .mini .av{width:40px;height:40px}
  body.fixed .mline{font-size:13px;line-height:1.5}
  body.fixed .qtext{font-size:20px}
  body.fixed .qtext.long{font-size:18px}
  body.fixed .qcount{margin-top:10px}
  body.fixed .opts{margin-top:14px}
  body.fixed .opt{height:46px;font-size:16px}
  body.fixed .rows{margin-top:10px}
  body.fixed .rowopt{min-height:42px;font-size:15px}
  body.fixed .uf.big input{font-size:26px}
  body.fixed .ufrow{margin-top:14px;gap:16px}
  body.fixed .sliders{margin-top:14px;gap:14px}
  body.fixed .consents{margin-top:14px;gap:10px}
  body.fixed .btn,body.fixed .round{height:44px}
  body.fixed .round{width:44px}
}
body.fixed .app{height:100dvh;min-height:0}
body.fixed .top,body.fixed .foot{flex:none}
body.fixed main{min-height:0;overflow:hidden}
.legal{margin-top:-6px}
.legal summary{font-size:clamp(10px,calc(.68*var(--u)),calc(12px*var(--k)));letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--dim);cursor:pointer;list-style:none}
.legal summary::-webkit-details-marker{display:none}
.legal summary::after{content:" ›"}
.legal[open] summary::after{content:" ˅"}
.legal summary:hover{color:var(--ink)}
.legal p{font-size:clamp(10px,calc(.66*var(--u)),calc(12px*var(--k)));color:var(--dim);line-height:1.6;margin-top:8px;max-width:46em}
#main > .screen{transform-origin:top left;display:flow-root}
.split{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1fr);gap:clamp(36px,calc(6.5*var(--u)),calc(130px*var(--k)));align-items:start}
.split > *{min-width:0}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}

/* ---------- Marcel ---------- */
.mcol{display:flex;flex-direction:column;gap:clamp(18px,calc(1.6*var(--u)),calc(30px*var(--k)))}
.mline{font-size:clamp(14px,calc(1.02*var(--u)),calc(19px*var(--k)));line-height:1.6;color:var(--ink);max-width:24em;position:relative;padding-left:clamp(14px,calc(1.05*var(--u)),calc(20px*var(--k)));border-left:2px solid transparent;border-image:var(--grad-135) 1}
.mini{display:flex;align-items:center;gap:clamp(12px,calc(.95*var(--u)),calc(18px*var(--k)))}
.mini .av{position:relative;width:clamp(52px,calc(3.6*var(--u)),calc(68px*var(--k)));height:clamp(52px,calc(3.6*var(--u)),calc(68px*var(--k)));border-radius:50%;overflow:hidden;flex:none;border:1.5px solid rgba(122,62,158,.8);display:block}
.mini .av img{width:100%;height:100%;object-fit:cover;display:block}
.mini .av i{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;background:#4ADE80;border:2px solid var(--ground)}
.mini .nm{display:flex;flex-direction:column;gap:4px}
.mini .nm b{font-size:clamp(14px,calc(.95*var(--u)),calc(18px*var(--k)));font-weight:700;line-height:1}
.mini .nm span{font-size:clamp(9px,calc(.66*var(--u)),calc(12px*var(--k)));letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:600}
.mhead{display:none;align-items:flex-start;gap:12px}
.mhead .av{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;border:1.5px solid rgba(122,62,158,.75)}
.mhead .av img{width:100%;height:100%;object-fit:cover;display:block}
.mhead .av i{position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:#4ADE80;border:2px solid var(--ground)}
.mhead .tx{flex:1;min-width:0}
.mhead .tx b{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:4px}
.mhead .tx p{font-size:13.5px;line-height:1.5;color:var(--ink)}
@media (max-width:1000px){
  .mcol{display:none}
  .mcol.intro-portrait{display:flex;gap:14px}
  .mcol.intro-portrait   .mcol.intro-portrait .mline{font-size:14px}
  .mhead{display:flex}
  main{align-items:flex-start}
}
.qcount.mob{display:none}
@media (max-width:1000px){.qcount.desk{display:none}.qcount.mob{display:flex;margin-top:16px}.qcount.mob + .qtext{margin-top:14px}}

/* ---------- otázky ---------- */
.qcount{display:flex;align-items:center;gap:18px;margin-top:clamp(20px,calc(2.9*var(--u)),calc(56px*var(--k)))}
.qcount .segs i{width:clamp(22px,calc(2.3*var(--u)),calc(44px*var(--k)))}
.qtext{font-size:clamp(23px,calc(2.6*var(--u)),calc(50px*var(--k)));font-weight:600;line-height:1.2;letter-spacing:-.005em;text-wrap:balance;margin:0}
.qtext.long{font-size:clamp(21px,calc(2.1*var(--u)),calc(40px*var(--k)))}
.qhint{margin-top:14px;font-size:clamp(14px,calc(.95*var(--u)),calc(18px*var(--k)));color:var(--muted);line-height:1.55}
.opts{display:flex;flex-wrap:wrap;gap:clamp(10px,calc(.95*var(--u)),calc(18px*var(--k)));margin-top:clamp(26px,calc(3.3*var(--u)),calc(64px*var(--k)))}
.opt{height:clamp(58px,calc(5.8*var(--u)),calc(112px*var(--k)));min-width:clamp(84px,calc(9.9*var(--u)),calc(190px*var(--k)));padding:0 clamp(22px,calc(1.9*var(--u)),calc(36px*var(--k)));border-radius:999px;border:1.5px solid rgba(255,255,255,.22);background:transparent;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,calc(2*var(--u)),calc(38px*var(--k)));font-weight:600;color:rgba(244,244,246,.84);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:rgba(255,255,255,.5)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 18px 50px rgba(47,134,204,.28)}
.rows{margin-top:clamp(22px,calc(2.3*var(--u)),calc(44px*var(--k)));border-bottom:1px solid rgba(255,255,255,.12)}
.rowopt{width:100%;display:flex;align-items:center;gap:clamp(16px,calc(1.45*var(--u)),calc(28px*var(--k)));min-height:clamp(56px,calc(3.9*var(--u)),calc(76px*var(--k)));padding:10px 0;border:0;border-top:1px solid rgba(255,255,255,.12);background:transparent;text-align:left;font-size:clamp(16px,calc(1.35*var(--u)),calc(26px*var(--k)));font-weight:500;color:var(--muted);cursor:pointer;transition:color .15s}
.rowopt:hover{color:var(--ink)}
.rowopt .mark{width:clamp(24px,calc(1.56*var(--u)),calc(30px*var(--k)));height:clamp(24px,calc(1.56*var(--u)),calc(30px*var(--k)));border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none;display:flex;align-items:center;justify-content:center}
.rowopt[aria-pressed="true"]{color:#fff;font-weight:600}
.rowopt[aria-pressed="true"] .mark{border-color:transparent;background:var(--grad)}
.rowopt[aria-pressed="true"] .mark::after{content:"";width:34%;height:34%;border-radius:50%;background:#fff}

/* číselná pole (desktop) */
.ufrow{display:grid;gap:clamp(22px,calc(2.5*var(--u)),calc(48px*var(--k)));grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));margin-top:clamp(26px,calc(2.6*var(--u)),calc(50px*var(--k)))}
.ufrow.one{--cols:1}
@media (max-width:760px){.ufrow{--cols:1!important}}
.uf{display:flex;flex-direction:column;gap:clamp(8px,calc(.75*var(--u)),calc(14px*var(--k)));min-width:0;padding-bottom:clamp(10px,calc(.95*var(--u)),calc(18px*var(--k)));border-bottom:1.5px solid var(--line2);transition:border-color .15s}
.uf:focus-within{border-color:#4FA3E0}
.uf.invalid{border-color:var(--crit)}
.uf label{font-size:clamp(10px,calc(.73*var(--u)),calc(14px*var(--k)));letter-spacing:.28em;font-weight:600;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uf label em{font-style:normal;letter-spacing:.12em;text-transform:none;font-weight:500}
.uf input{width:100%;min-width:0;background:transparent;border:0;outline:none;padding:0;font-size:clamp(22px,calc(1.9*var(--u)),calc(36px*var(--k)));font-weight:400;line-height:1.15}
.uf input::placeholder{color:rgba(244,244,246,.22)}
/* Chrome a Safari podbarvují automaticky vyplněná políčka; přebíjíme to, ať drží tmavý vzhled. */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{
  -webkit-text-fill-color:var(--ink);
  -webkit-background-clip:text;
  caret-color:var(--ink);
  transition:background-color 600000s 0s,color 600000s 0s
}
input:autofill{background:transparent;color:var(--ink)}

.uf input[type="email"],.uf input[type="tel"]{font-size:clamp(17px,calc(1.35*var(--u)),calc(26px*var(--k)))}
.uf.big input{font-size:clamp(34px,calc(4.4*var(--u)),calc(84px*var(--k)));font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.uf input::-webkit-outer-spin-button,.uf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.uf input[type="number"]{-moz-appearance:textfield}

/* posuvníky (mobil) */
.sliders{display:flex;flex-direction:column;gap:26px;margin-top:26px}
.srow .slab{font-size:11px;letter-spacing:.26em;font-weight:600;color:var(--dim);text-transform:uppercase}
.srow .sval{font-size:44px;font-weight:300;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}

/* ---------- pomocné ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('cs-CZ');
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const icon = (id, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const isNarrow = () => matchMedia('(max-width:1000px)').matches;
const isMobile = () => matchMedia('(max-width:760px)').matches;
const pad2 = n => String(n).padStart(2, '0');

/* ---------- stav ---------- */
const newSid = () => (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
const blank = () => ({ cur: 'intro', sid: newSid(), a: {}, booking: { type: null, slot: null }, startedAt: new Date().toISOString() });
let S = blank();
function save() { try { sessionStorage.setItem(CFG.storageKey, JSON.stringify(S)); } catch (e) {} }
function load() { try { const raw = sessionStorage.getItem(CFG.storageKey); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {} }

/* ---------- výpočty ---------- */
function calcBMI(h, w) { const H = num(h), W = num(w); if (!H || !W) return null; return +(W / Math.pow(H / 100, 2)).toFixed(1); }
function bmiCategory(bmi) {
  const b = num(bmi); if (b == null) return '';
  if (b < 18.5) return 'podváha'; if (b < 25) return 'normální váha'; if (b < 30) return 'nadváha';
  if (b < 35) return 'obezita I. stupně'; if (b < 40) return 'obezita II. stupně'; return 'obezita III. stupně';
}
function programMonths(d) {
  const start = num(d.weight), target = num(d.targetWeight), h = num(d.height) || 172;
  if (start == null || target == null || start <= target) return 3;
  const bmi = start / Math.pow(h / 100, 2);
  const perMonth = bmi < 27 ? 3.5 : bmi < 30 ? 3.8 : bmi < 35 ? 3.0 : 2.5;
  return Math.max(3, Math.min(24, Math.round((start - target) / perMonth)));
}
function hardContra(d) {
  const bmi = num(d.bmi);
  if (d.pank === 'Ano') return 'anamnézy zánětu slinivky břišní (pankreatitida)';
  if (d.men2 === 'Ano') return 'výskytu syndromu MEN 1/2 nebo medulárního karcinomu štítné žlázy v rodinné anamnéze';
  if (d.ppp === 'Ano') return 'léčby poruchy příjmu potravy v anamnéze';
  if (bmi != null && bmi < 23) return `nízkého BMI (${bmi})`;
  return null;
}
function calcScore(d) {
  let p = 0;
  if (d.pank === 'Ne') p++;
  if (d.men2 === 'Ne' || d.men2 === 'Nevím') p++;
  if (['Ne', 'Prediabetes', 'Inzulinová rezistence'].includes(d.diab)) p++;
  if (d.zluc === 'Ne') p++;
  if (d.led === 'Ne') p++;
  if (d.ppp === 'Ne') p++;
  const bmi = num(d.bmi) || 0;
  if (bmi >= 25) p += 2;
  const diff = (num(d.weight) || 0) - (num(d.targetWeight) || 0);
  if (diff >= 10) p += 2; else if (diff >= 5) p += 1;
  const score = Math.min(p, 10);
  const label = score >= 9 ? 'Výborná' : score >= 8 ? 'Vysoká' : score >= 6 ? 'Střední' : 'Nízká';
  const cls = score >= 8 ? 'good' : score >= 6 ? 'warn' : 'crit';
  return { score, label, cls };
}

/* Volba preparátu — rozhodovací strom odsouhlasený s klinikou.
   Pořadí podmínek je závazné, první splněná vyhrává. */
const DRUGS = {
  wegovy:   { name: 'Wegovy®', inn: 'semaglutid' },
  mounjaro: { name: 'Mounjaro®', inn: 'tirzepatid' }
};
function recommend(d) {
  const bmi = num(d.bmi) || 0;
  const w = num(d.weight) || 0, tw = num(d.targetWeight) || 0;
  const lossPct = w > 0 ? ((w - tw) / w) * 100 : 0;
  const prev = d.glp1drug || '';
  const sat = d.glp1sat || '';
  const hadSema = prev === 'Wegovy®' || prev === 'Ozempic®';
  const hadTirz = prev === 'Mounjaro®';
  const dysgly = ['Prediabetes', 'Inzulinová rezistence', 'Diabetes 2. typu'].includes(d.diab);

  let key, why, alt = null;

  if (hadSema && sat === 'Dobrý efekt') {
    key = 'wegovy';
    why = 'Semaglutid u Vás už zabíral, takže není důvod ho měnit. Navážeme na to, co fungovalo, a doladíme dávkování.';
    alt = 'Pokud se úbytek zastaví na plató, je Mounjaro® logickým dalším krokem.';
  } else if (hadSema && sat === 'Slabý efekt') {
    key = 'mounjaro';
    why = 'Semaglutid u Vás nepřinesl očekávaný efekt. Tirzepatid působí přes dva receptory (GIP i GLP-1) a v přímém srovnání dosahuje výrazně vyššího úbytku.';
  } else if (hadTirz && sat === 'Špatně jsem ho snášel/a') {
    key = 'wegovy';
    why = 'Tirzepatid jste snášel/a špatně. Semaglutid bývá pro trávení šetrnější a s pomalým navyšováním dávky se obvykle zvládne dobře.';
  } else if (hadSema && sat === 'Špatně jsem ho snášel/a') {
    key = 'wegovy';
    why = 'Nesnášenlivost bývá nejčastěji z příliš rychlého navyšování dávky. Začneme od nejnižší dávky a budeme postupovat pomaleji.';
    alt = 'Pokud potíže přetrvají, na kontrole zvážíme přechod na Mounjaro®.';
  } else if (dysgly) {
    key = 'mounjaro';
    why = 'Máte v anamnéze poruchu zpracování cukru. Tirzepatid má nejsilnější efekt na inzulinovou rezistenci a hladinu cukru a zároveň vede k vyššímu úbytku hmotnosti.';
  } else if (bmi < 25) {
    key = 'wegovy';
    why = 'Vaše BMI je v pásmu normální váhy, takže nejsilnější preparát není namístě. Semaglutid utlumí chutě a udrží úbytek pozvolný a bezpečný.';
  } else if (d.goal === 'Zbavit se neustálých chutí a myšlenek na jídlo') {
    key = 'wegovy';
    why = 'Vaším cílem je klid od jídla. Na „food noise“ semaglutid bohatě stačí a nemá smysl jít po nejsilnějším preparátu.';
    alt = bmi >= 30 ? 'Při Vašem BMI by Mounjaro® přineslo rychlejší úbytek. Pokud budete chtít i výraznější zhubnutí, probereme ho na konzultaci.' : null;
  } else if (d.goal === 'Výrazně zhubnout') {
    key = 'mounjaro';
    why = 'Pro výrazný úbytek je v této třídě nejúčinnější — ve studiích vedl k průměrnému poklesu okolo 20 % hmotnosti.';
  } else if (lossPct < 10) {
    key = 'wegovy';
    why = 'Váš cíl je v dosahu mírnější terapie. Semaglutid na pár kilo stačí a je šetrnější k peněžence i k trávení.';
  } else {
    key = 'mounjaro';
    why = `Chcete se dostat o ${Math.round(lossPct)} % níž. Na takový cíl je tirzepatid vhodnější, protože dosahuje vyššího průměrného úbytku.`;
  }

  const other = key === 'wegovy' ? 'mounjaro' : 'wegovy';
  if (!alt && bmi >= 27 && key === 'wegovy') alt = 'Kdyby úbytek nebyl dostatečný, Mounjaro® je připravené jako další krok.';
  if (!alt && key === 'mounjaro' && d.goal !== 'Výrazně zhubnout') alt = 'Pokud byste chtěl/a začít mírněji, je Wegovy® plnohodnotnou alternativou.';

  return { key, drug: DRUGS[key], why, alt, altDrug: DRUGS[other], offLabel: bmi < 27 };
}

function compute() {
  const d = S.a;
  d.bmi = calcBMI(d.height, d.weight);
  const months = programMonths(d);
  const contra = hardContra(d);
  const sc = calcScore(d);
  const rec = contra ? null : recommend(d);
  const w = num(d.weight) || 0, tw = num(d.targetWeight) || 0;
  return { bmi: d.bmi, months, contra, score: sc, rec, lose: Math.max(0, Math.round(w - tw)), weight: w, target: tw };
}

/* Průvodce se musí vejít na jednu obrazovku bez rolování: nejdřív zúžíme
   jednořádkové titulky, pak celou obrazovku proporčně zmenšíme. Výsledek
   je dlouhý report, ten roluje normálně. */
function fitLines() {
  document.querySelectorAll('.fitline').forEach(el => {
    el.style.fontSize = '';
    const parent = el.parentElement;
    const avail = parent.clientWidth;
    if (!avail) return;
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 60;
    while (el.scrollWidth > avail && size > 13 && guard--) {
      size = Math.max(13, size * Math.min(0.97, Math.max(0.75, avail / el.scrollWidth)));
      el.style.fontSize = size + 'px';
    }
  });
}
function fitScreen() {
  const guide = S.cur !== 'result';
  document.body.classList.toggle('fixed', guide);
  const sc = document.querySelector('#main > .screen');
  // animace .screen končí na transform:none, proto zmenšení zapisujeme jako !important
  if (sc) { sc.style.removeProperty('transform'); sc.style.removeProperty('width'); }
  if (!guide || !sc) return;
  fitLines();
  const main = document.getElementById('main');
  const cs = getComputedStyle(main);
  const avail = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  // scrollHeight nepočítá spodní okraje potomků, proto měříme i podle jejich rámečků
  const top = sc.getBoundingClientRect().top;
  let bottom = top + sc.scrollHeight;
  sc.querySelectorAll('*').forEach(el => {
    if (!el.offsetParent && el.tagName !== 'BODY') return;            // skryté prvky neměříme
    if (el.closest('details:not([open])') && el.tagName !== 'SUMMARY') return;
    const b = el.getBoundingClientRect().bottom; if (b > bottom) bottom = b;
  });
  const needed = Math.ceil(bottom - top) + 2;
  if (needed > avail && avail > 0) {
    // obsah se nevejde: zmenšíme ho a necháme od horního okraje
    const scale = Math.max(0.45, avail / needed);
    sc.style.setProperty('width', (100 / scale) + '%', 'important');
    sc.style.setProperty('transform', `scale(${scale})`, 'important');
    main.style.alignItems = 'flex-start';
  } else {
    // vejde se: vycentrujeme na výšku, ať text nevisí u horního okraje
    main.style.alignItems = 'center';
  }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitScreen());

function needsNext(id) {
  const q = Q[id];
  if (q.type === 'num') return true;
  return S.a[id] != null;                       // u voleb se tlačítko objeví až po odpovědi
}

function questionHTML(id) {
  const q = Q[id];
  let h = `<p class="qtext${q.label.length > 68 ? ' long' : ''}" id="qtext">${esc(q.label)}</p>`;
  if (q.hint) h += `<p class="qhint">${esc(q.hint)}</p>`;
  if (q.type === 'num') {
    const fields = typeof q.fields === 'function' ? q.fields(S.a) : q.fields;
    h += isMobile() ? slidersHTML(fields) : fieldsHTML(fields);
    return h;
  }
  const v = S.a[id];
  const rows = q.rows || q.opts.some(o => o.length > 14);
  if (rows) {
    h += `<div class="rows" role="group" aria-labelledby="qtext">${q.opts.map((o, i) => `<button type="button" class="rowopt" data-single="${id}" data-i="${i}" aria-pressed="${v === o}"><span class="mark"></span>${esc(o)}</button>`).join('')}</div>`;
  } else {
    h += `<div class="opts" role="group" aria-labelledby="qtext">${q.opts.map((o, i) => `<button type="button" class="opt" data-single="${id}" data-i="${i}" aria-pressed="${v === o}">${esc(o)}</button>`).join('')}</div>`;
  }
  return h;
}

function fieldsHTML(fields) {
  return `<div class="ufrow${fields.length === 1 ? ' one' : ''}">${fields.map(f => {
    const val = S.a[f.key] != null ? S.a[f.key] : f.def;
    return `<div class="uf big" id="w-${f.key}"><label for="f-${f.key}">${esc(f.label)} <em>· ${esc(f.unit)}</em></label>
      <input id="f-${f.key}" type="number" inputmode="numeric" data-num="${f.key}" min="${f.min}" max="${f.max}" value="${esc(val)}"></div>`;
  }).join('')}</div>`;
}
function slidersHTML(fields) {
  return `<div class="sliders">${fields.map(f => {
    const val = S.a[f.key] != null ? +S.a[f.key] : f.def;
    return `<div class="srow"><div class="slab">${esc(f.label)}</div>
      <div class="sval" id="v-${f.key}">${val}<em>${esc(f.unit)}</em></div>
      <input class="srng" type="range" data-rng="${f.key}" data-unit="${esc(f.unit)}" min="${f.min}" max="${f.max}" step="1" value="${val}">
      <div class="sends"><span>${f.min}</span><span>${f.max}</span></div></div>`;
  }).join('')}</div>`;
}
function initNumeric(id) {
  const q = Q[id];
  const fields = typeof q.fields === 'function' ? q.fields(S.a) : q.fields;
  fields.forEach(f => { if (S.a[f.key] == null) S.a[f.key] = f.def; });
  document.querySelectorAll('[data-rng]').forEach(r => { paintRange(r); });
  save();
}
function paintRange(r) {
  const min = +r.min, max = +r.max, v = +r.value;
  const pct = ((v - min) / (max - min)) * 100;
  r.style.background = `linear-gradient(90deg,#7A3E9E 0%,#4FA3E0 ${pct}%,rgba(255,255,255,.16) ${pct}%,rgba(255,255,255,.16) 100%)`;
}
function ufHTML(key, label, o = {}) {
  const val = S.a[key] ?? '';
  return `<div class="uf" id="w-${key}"><label for="f-${key}">${esc(label)}</label>
    <input id="f-${key}" type="${o.type || 'text'}" inputmode="${o.inputmode || 'text'}" autocomplete="${o.autocomplete || 'off'}" placeholder="${esc(o.placeholder || '')}" data-txt="${key}" value="${esc(val)}"></div>`;
}
function cboxHTML(id, checked, html, consentKey) {
  return `<label class="cbox"><input type="checkbox" id="${id}" data-consent="${consentKey}" ${checked ? 'checked' : ''}><span class="box">${icon('i-check')}</span><span>${html}</span></label>`;
}

/* ---------- navigace ---------- */
function go(dir) {
  const steps = buildSteps(); const st = steps[curIndex(steps)];
  if (dir > 0) { const err = validate(st); if (err) { showErr(err); return; } }
  const s2 = buildSteps(); const i2 = Math.max(0, Math.min(s2.length - 1, curIndex(s2) + dir));
  if (s2[i2].key === 'generating' && dir < 0) { S.cur = 'contact'; render(); window.scrollTo(0, 0); return; }
  S.cur = s2[i2].key;
  render(); window.scrollTo(0, 0);
}
function showErr(err) {
  const el = $('#err'); if (el) el.textContent = err.msg;
  if (err.focus) { const w = document.getElementById('w-' + err.focus), f = document.getElementById('f-' + err.focus);
    if (w) w.classList.add('invalid');
    if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'center' }); f.focus({ preventScroll: true }); } }
}
function validate(st) {
  if (st.key.startsWith('q:')) {
    const q = Q[st.id];
    if (q.type === 'num') {
      const fields = typeof q.fields === 'function' ? q.fields(S.a) : q.fields;
      for (const f of fields) {
        const v = num(S.a[f.key]);
        if (v == null) return { msg: `Vyplňte prosím: ${f.label}.`, focus: f.key };
        if (v < f.min || v > f.max) return { msg: `${f.label}: zadejte hodnotu mezi ${f.min} a ${f.max}.`, focus: f.key };
      }
      if (st.id === 'target' && num(S.a.targetWeight) >= num(S.a.weight)) return { msg: 'Cílová váha musí být nižší než současná.', focus: 'targetWeight' };
      return null;
    }
    if (S.a[st.id] == null) return { msg: 'Vyberte prosím odpověď.' };
  }
  if (st.key === 'contact') {
    const nm = (S.a.firstName || '').trim();
    if (!nm) return { msg: 'Vyplňte prosím jméno a příjmení.', focus: 'firstName' };
    if (!/\s/.test(nm)) return { msg: 'Doplňte prosím i příjmení.', focus: 'firstName' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((S.a.email || '').trim())) return { msg: 'Zadejte prosím platný e-mail.', focus: 'email' };
    if (!S.a.gdpr) return { msg: 'Pro pokračování je potřeba souhlas se zpracováním údajů.' };
  }
  return null;
}

/* ---------- události ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'next') return go(1);
  if (act === 'back') return go(-1);
  if (act === 'restart') { if (confirm('Opravdu začít znovu? Vyplněné odpovědi se smažou.')) resetAll(); return; }
  if (b.dataset.single != null) return pickSingle(b.dataset.single, +b.dataset.i);
});
function pickSingle(id, i) {
  const val = Q[id].opts[i];
  S.a[id] = val; save();
  document.querySelectorAll(`[data-single="${id}"]`).forEach(c => c.setAttribute('aria-pressed', +c.dataset.i === i));
  const err = $('#err'); if (err) err.textContent = '';
  clearTimeout(autoT);
  autoT = setTimeout(() => { if (S.cur === 'q:' + id) go(1); }, CFG.autoAdvanceMs);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.rng) {
    const key = t.dataset.rng;
    S.a[key] = +t.value; paintRange(t);
    const v = document.getElementById('v-' + key);
    if (v) v.innerHTML = `${t.value}<em>${t.dataset.unit}</em>`;
    save(); return;
  }
  if (t.dataset.num) { S.a[t.dataset.num] = t.value; clearInvalid(t); save(); return; }
  if (t.dataset.txt) { S.a[t.dataset.txt] = t.value; clearInvalid(t); save(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.consent) { S.a[t.dataset.consent] = t.checked; const err = $('#err'); if (err) err.textContent = ''; save(); }
});
function clearInvalid(t) {
  const w = t.closest('.uf'); if (w) w.classList.remove('invalid');
  const err = $('#err'); if (err) err.textContent = '';
}

const GEN_CHECKS = ['ANTROPOMETRIE', 'KONTRAINDIKACE', 'ANAMNÉZA', 'CÍL REDUKCE', 'VOLBA PREPARÁTU', 'PLÁN PROGRAMU'];
const GEN_MESSAGES = [
  'Počítám BMI a cílovou redukci…',
  'Procházím kontraindikace a Vaši anamnézu…',
  'Porovnávám Váš cíl s účinností jednotlivých preparátů…',
  'Sestavuji odhad délky programu…',
  'Skládám výsledek dohromady…'
];
let genTimer = null;
function runGenerating() {
  const total = 9000, t0 = Date.now();
  const arc = $('#arc'), txt = $('#ringTxt'), bar = $('#genBar'), stat = $('#genStatus'), checks = $('#checks');
  let msgIdx = 0;
  clearInterval(genTimer);
  genTimer = setInterval(() => {
    const p = Math.min(1, (Date.now() - t0) / total);
    const pct = Math.round(p * 100);
    if (arc) arc.setAttribute('stroke-dashoffset', String(1482.8 * (1 - p)));
    if (txt) txt.textContent = pct + ' %';
    if (bar) bar.style.width = pct + '%';
    const ci = Math.min(GEN_CHECKS.length - 1, Math.floor(p * GEN_CHECKS.length));
    if (checks) checks.querySelectorAll('div').forEach((d, i) => { d.className = i < ci ? 'done' : i === ci ? 'cur' : ''; });
    const mi = Math.min(GEN_MESSAGES.length - 1, Math.floor(p * GEN_MESSAGES.length));
    if (mi !== msgIdx && stat) {
      msgIdx = mi; stat.classList.add('fade');
      setTimeout(() => { stat.textContent = GEN_MESSAGES[msgIdx]; stat.classList.remove('fade'); }, 260);
    }
    if (p >= 1) {
      clearInterval(genTimer);
      if (checks) checks.querySelectorAll('div').forEach(d => d.className = 'done');
      setTimeout(() => { S.cur = 'result'; render(); window.scrollTo(0, 0); }, 420);
    }
  }, 60);
}

function chartSVG(startW, endW, months) {
  const W = 620, H = 200, pad = { t: 22, r: 64, b: 26, l: 56 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const span = Math.max(1, (startW - endW) * 1.2);
  const minY = endW - (startW - endW) * 0.12;
  const toX = m => pad.l + (m / months) * iw;
  const toY = w => pad.t + ih - ((w - minY) / span) * ih;
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40, eased = 1 - Math.pow(1 - t, 1.8);
    pts.push([toX(t * months), toY(startW - (startW - endW) * eased)]);
  }
  let d = `M ${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
    d += ` C ${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  const area = d + ` L ${pts[pts.length - 1][0]},${H - pad.b} L ${pts[0][0]},${H - pad.b} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Předpokládaný průběh hmotnosti">
    <line x1="${pad.l}" y1="${toY(startW)}" x2="${W - pad.r}" y2="${toY(startW)}" stroke="rgba(255,255,255,.09)" stroke-dasharray="4,4"/>
    <line x1="${pad.l}" y1="${toY(endW)}" x2="${W - pad.r}" y2="${toY(endW)}" stroke="rgba(79,163,224,.28)" stroke-dasharray="4,4"/>
    <path d="${area}" fill="url(#chartG)"/>
    <path d="${d}" fill="none" stroke="url(#chartL)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${toX(0)}" cy="${toY(startW)}" r="5" fill="#B391E0"/>
    <circle cx="${toX(months)}" cy="${toY(endW)}" r="6" fill="#4FA3E0"/>
    <circle cx="${toX(months)}" cy="${toY(endW)}" r="12" fill="#4FA3E0" opacity="0.22"/>
    <text x="${pad.l - 8}" y="${toY(startW) + 5}" text-anchor="end" fill="rgba(244,244,246,.5)" font-size="14" font-family="Montserrat,sans-serif">${Math.round(startW)} kg</text>
    <text x="${W - pad.r + 10}" y="${toY(endW) + 5}" text-anchor="start" fill="#8FC1EC" font-size="14" font-weight="600" font-family="Montserrat,sans-serif">${Math.round(endW)} kg</text>
  </svg>`;
}

/* Záložní generátor termínů z CFG.hours — používá se, dokud není nasazený backend. */
function demoSlots() {
  const out = [];
  const now = new Date();
  const from = new Date(now.getTime() + CFG.minHours * 3600e3);
  for (let dayOff = 0; dayOff <= CFG.leadDays; dayOff++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOff);
    (CFG.hours[day.getDay()] || []).forEach(([a, z]) => {
      const [ah, am] = a.split(':').map(Number), [zh, zm] = z.split(':').map(Number);
      let t = new Date(day); t.setHours(ah, am, 0, 0);
      const end = new Date(day); end.setHours(zh, zm, 0, 0);
      while (t.getTime() + CFG.duration * 60e3 <= end.getTime()) {
        if (t > from && (t.getDate() + t.getHours()) % 3 !== 0) out.push(localIso(t));
        t = new Date(t.getTime() + CFG.slotStepMin * 60e3);
      }
    });
  }
  return out.slice(0, 120);
}
const localIso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  const m = BOOK_ERRORS[code];
  if (m) return m.endsWith(' ') ? m + CFG.phone + '.' : m;
  return 'Rezervaci se nepodařilo dokončit. Zkuste to prosím znovu, nebo nám zavolejte na ' + CFG.phone + '.';
}
async function submitBooking(btn) {
  const err = m => { const el = $('#bookErr'); if (el) el.textContent = m; };
  err('');
  if (!S.booking.slot) return err('Vyberte prosím čas konzultace.');
  if (!/^\+?[\d\s]{9,16}$/.test((S.a.phone || '').trim())) return err('Telefon zadejte ve tvaru +420 777 123 456.');
  if (!S.a.bookConsent) return err('Pro rezervaci je potřeba souhlas.');
  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>Blokuji termín…';
  const wait = document.createElement('p');
  wait.className = 'fine';
  wait.style.textAlign = 'center';
  wait.textContent = 'Držíme pro Vás termín a připravujeme platbu, chvilku strpení.';
  btn.insertAdjacentElement('afterend', wait);
  const cleanup = () => { wait.remove(); btn.innerHTML = 'Rezervovat termín'; };
  try {
    const id = await ensureSubmitted();
    let hold;
    if (CFG.apiUrl) {
      hold = await api('hold', {
        id, slot: S.booking.slot, type: S.booking.type,
        name: S.a.firstName, email: S.a.email, phone: S.a.phone.trim(), consent: true
      }, 45000);
    } else {
      const vs = String(Date.now()).slice(-8);
      hold = { vs, amount: CFG.price, account: '2801448429/2010', spayd: spaydFor(vs, CFG.price), checkoutUrl: '' };
    }
    if (!hold || !hold.vs) throw Object.assign(new Error('no_vs'), { code: 'no_vs' });
    S.booking.hold = hold;
    rerenderPanel();
  } catch (x) {
    btn.disabled = false; cleanup();
    err(bookError(x));
    if (x && x.code === 'slot_taken') { slotCache = null; S.booking.slot = null; loadSlots(); }
  }
}

function spaydFor(vs, amount) {
  return 'SPD*1.0*ACC:' + CFG.iban + '*AM:' + Number(amount).toFixed(2) + '*CC:CZK*X-VS:' + vs + '*MSG:AETERNUM KONZULTACE*RN:AETERNUM CLINIC';
}
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
let qrPromise = null;
function loadQrLib() {
  if (!qrPromise) qrPromise = new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = QR_LIB; s.async = true;
    s.onload = ok; s.onerror = () => { qrPromise = null; fail(new Error('qr')); };
    document.head.appendChild(s);
  });
  return qrPromise;
}
async function showQr() {
  const box = $('#payQr'), h = S.booking.hold; if (!box || !h) return;
  const payload = h.spayd || spaydFor(h.vs, h.amount || CFG.price);
  try {
    await loadQrLib();
    const q = window.qrcode(0, 'M'); q.addData(payload); q.make();
    box.innerHTML = q.createImgTag(5, 2, 'QR platba');
  } catch (e) {
    box.textContent = 'QR kód najdete v e-mailu.';
    box.style.cssText = 'font-size:13px;color:#19191B;line-height:1.4;padding:16px;max-width:150px';
  }
}
function startPolling() {
  clearInterval(pollTimer);
  if (!CFG.apiUrl || !S.booking.hold) return;
  // Po návratu z platební brány se ptáme často, ať člověk nečeká u prázdné obrazovky.
  const fast = !!S.verifying;
  let ticks = 0;
  pollTimer = setInterval(async () => {
    ticks++;
    if (S.verifying) { S.verifyStep = Math.min(2, Math.floor(ticks / 3)); rerenderPanel(); }
    try {
      const j = await api('payStatus', { vs: S.booking.hold.vs }, 15000);
      if (j.paid) {
        clearInterval(pollTimer);
        S.verifying = false;
        S.booking.paid = true;
        if (j.slot) S.booking.slot = j.slot;
        if (j.type) S.booking.type = j.type;
        if (j.meet) S.booking.meet = j.meet;
        if (j.email && !S.a.email) S.a.email = j.email;
        rerenderPanel();
      } else if (j.expired) {
        clearInterval(pollTimer);
        S.verifying = false;
        S.booking.hold = null; S.booking.slot = null; slotCache = null;
        rerenderPanel(); loadSlots();
      } else if (fast && ticks > 40) {
        // po dvou minutách přepneme zpět na platební panel, ať člověk vidí QR i kartu
        clearInterval(pollTimer);
        S.verifying = false; rerenderPanel(); startPolling();
      }
    } catch (e) {}
  }, fast ? 3000 : CFG.pollMs);
}

/* ---------- odeslání na backend ---------- */
// Žádost o zpětné volání z obrazovky po odmítnutí termínu.
async function submitCallback(btn) {
  const err = m => { const el = $('#callErr'); if (el) el.textContent = m; };
  err('');
  const phone = String(S.a.phone || '').trim();
  if (!/^\+?[\d\s]{9,16}$/.test(phone)) return err('Telefon zadejte ve tvaru +420 777 123 456.');
  if (!S.a.callConsent) return err('Bez souhlasu Vám bohužel nemůžeme zavolat.');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Odesíláme…';
  try {
    if (CFG.apiUrl && !CFG.demo) {
      const id = await ensureSubmitted();
      await api('callback', { id: id, phone: phone, consent: true }, 20000);
    }
    S.booking.intent = 'Zpětné volání';
    S.booking.callbackDone = true;
    save(); rerenderPanel();
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    err('Odeslání se nepodařilo. Zkuste to prosím znovu, nebo zavolejte na ' + CFG.phone + '.');
  }
}

async function api(action, data, timeoutMs = 30000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(CFG.apiUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, sid: S.sid, ...data }), signal: ctrl.signal
    });
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || 'api'); e.code = j.error; throw e; }
    return j;
  } finally { clearTimeout(t); }
}

let submitPromise = null;
function sendStatusHTML() {
  const st = S.send;
  if (!CFG.apiUrl || !st) return '<p class="send-status" id="sendStatus" hidden></p>';
  const email = `<b style="color:var(--ink)">${esc(S.a.email)}</b>`;
  const text = st === 'sending' ? `Posílám Váš výsledek na ${email}…`
    : st === 'sent' ? `Výsledek jsme poslali na ${email}.`
    : `Výsledek je uložený, ale e-mail se nepodařilo odeslat. Ozveme se Vám.`;
  return `<p class="send-status ${st}" id="sendStatus" role="status"><span class="dot"></span><span>${text}</span></p>`;
}
function setSend(state) {
  S.send = state; save();
  const el = $('#sendStatus'); if (el) el.outerHTML = sendStatusHTML();
}
function payload() {
  const R = window.__result || compute();
  return {
    src: CFG.src, startedAt: S.startedAt, finishedAt: new Date().toISOString(),
    name: S.a.firstName, email: S.a.email, phone: S.a.phone || '',
    consents: { gdpr: !!S.a.gdpr, marketing: !!S.a.marketing, booking: !!S.a.bookConsent, version: '2026-09-v1' },
    gender: S.a.gender, age: num(S.a.age), height: num(S.a.height), weight: num(S.a.weight),
    targetWeight: num(S.a.targetWeight), bmi: R.bmi, bmiCategory: bmiCategory(R.bmi),
    goal: S.a.goal, glp1: S.a.glp1, glp1drug: S.a.glp1drug || '', glp1sat: S.a.glp1sat || '',
    answers: { pank: S.a.pank, men2: S.a.men2, diab: S.a.diab, zluc: S.a.zluc, led: S.a.led, ppp: S.a.ppp, stit: S.a.stit, kard: S.a.kard, pohyb: S.a.pohyb, spanek: S.a.spanek },
    score: R.score.score, scoreLabel: R.score.label, contraindication: R.contra || '',
    reservationIntent: S.booking.intent || '', bookingType: S.booking.type || '',
    recommendation: R.rec ? R.rec.drug.name : '', recommendationWhy: R.rec ? R.rec.why : '',
    alternative: R.rec && R.rec.alt ? R.rec.altDrug.name : '', programMonths: R.months, lose: R.lose
  };
}
function ensureSubmitted() {
  if (!CFG.apiUrl || CFG.demo) return Promise.resolve(null);   // ukázková data se nikam neodesílají
  if (S.recordId) return Promise.resolve(S.recordId);
  if (submitPromise) return submitPromise;
  setSend('sending');
  submitPromise = api('submitScreening', { screening: payload() }, 60000)
    .then(j => { S.recordId = j.id; setSend(j.emailed ? 'sent' : 'saved'); return j.id; })
    .catch(e => { setSend('failed'); submitPromise = null; throw e; });
  return submitPromise;
}

/* ---------- reset ---------- */
function resetAll() {
  clearInterval(genTimer); clearInterval(pollTimer); clearTimeout(autoT);
  slotCache = null; submitPromise = null;
  S = blank(); try { sessionStorage.removeItem(CFG.storageKey); } catch (e) {}
  render(); window.scrollTo(0, 0);
}

/* ---------- demo ---------- */
function fillDemo() {
  S = blank();
  Object.assign(S.a, {
    firstName: 'Petra Nováková', email: 'petra.demo@example.cz', gdpr: true, marketing: false,
    gender: 'Žena', age: 42, height: 168, weight: 92, targetWeight: 78,
    goal: 'Zbavit se neustálých chutí a myšlenek na jídlo', glp1: 'Nemám zkušenosti',
    pank: 'Ne', men2: 'Ne', diab: 'Prediabetes', zluc: 'Ne', led: 'Ne', ppp: 'Ne',
    stit: 'Bez problémů', kard: 'Zvýšený tlak', pohyb: '1–2× týdně', spanek: '6–7h'
  });
  S.cur = 'result';
}

/* ---------- start ---------- */
if (CFG.demo) { fillDemo(); const t = document.createElement('div'); t.className = 'demo-tag'; t.textContent = 'Ukázková data'; document.body.appendChild(t); }
else load();
// Návrat z platební brány zpět na výsledky: rovnou ukážeme ověřování platby.
const paidVs = URLP.get('paid');
if (paidVs && S.booking && !S.booking.paid) {
  if (!S.booking.hold || S.booking.hold.vs !== paidVs) S.booking.hold = { vs: paidVs, amount: CFG.price };
  S.verifying = true; S.verifyStep = 0;
  S.cur = 'result';
}
if (S.cur === 'generating') S.cur = 'contact';
render();
</script>
